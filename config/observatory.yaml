    - "SAGE"
    - "Elsevier"
    - "De Gruyter"
    - "Edward Elgar"
    - "Bristol University Press"
    - "Manchester University Press"
    - "Pluto"
    - "Zed"
    - "Verso"
    - "James Currey"
    - "Hurst"
    - "Annual Reviews"
    - "MIT Press"
    - "Cornell"
    - "Princeton"
    - "Stanford"
    - "Johns Hopkins"
    - "Project MUSE"
    - "Emerald"
    - "Karthala"
    - "Presses de Sciences Po"
    - "Cairn"
    - "OpenEdition"
