# ---------------------------------------------------------------------
#  TRUST: how the sweep judges venues and publishers, without h-index.
#  Levels, best to worst:
#    watched     watched journal, or a work by a watched author
#    trusted     publisher on trusted_publishers (university presses,
#                established scholarly houses), or an OA journal in DOAJ
#    series      working-paper series on trusted_series
#    repository  preprint server / institutional repository
#    unknown     no signal either way (never pre-ticked unless it cites 2+ anchors)
#    denied      venue or publisher on a deny list: dropped
#  A work that cites two or more anchors is treated as engaged with the field
#  and can be pre-ticked even from an unknown venue.
# ---------------------------------------------------------------------
trust:
  trusted_publishers:
    - "University Press"         # matches any university press
    - "University of Chicago"
    - "Cambridge University"
    - "Oxford University"
    - "Duke"
    - "Routledge"
    - "Taylor & Francis"
    - "Informa"
    - "Wiley"
