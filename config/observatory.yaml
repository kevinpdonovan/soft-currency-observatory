    - "European Journal of Business and Management"
    - "Research Journal of Finance and Accounting"
    - "International Journal of Innovative Science and Research Technology"
  publisher_denylist:
    - "Scientific Research Publishing"
    - "OMICS"
    - "Science Publishing Group"
    - "IISTE"
    - "Academic Journals"
    - "Sciencedomain"

# ---------------------------------------------------------------------
#  SCORING (density). Change with care; documented on the About page.
# ---------------------------------------------------------------------
scoring:
  # anchor weight when not set by hand: min(1, (reference / citations) ** exponent)
  weight_reference_citations: 150
  weight_exponent: 0.5
  weight_floor: 0.08
  term_weight: 0.25          # per distinct term found
  term_cap: 8                # at most this many terms count
  trust_bonus: {watched: 0.6, trusted: 0.2, series: 0.1, repository: 0, unknown: 0}
  review_max: {citing: 45, related: 25, candidates: 10}
  pretick_density: 1.0       # pre-tick citing works at or above this density
