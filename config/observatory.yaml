# =====================================================================
#  OBSERVATORY PROFILE: what the monthly sweep looks for, and how it judges.
#  Edit freely on GitHub (pencil icon → Commit). Changes apply at the next run.
# =====================================================================

project:
  name: "Soft Currency Observatory"
  # Briefs the AI screener. Keep it to a paragraph; update as the project moves.
  brief: >
    A research network on soft currencies: money that does not travel at par, whether
    because it is inconvertible, subordinate in the international currency hierarchy,
    unstable, or confined to particular circuits. The core is economic anthropology
    (monetary repertoires, conversion, value, livelihoods), in conversation with history,
    sociology, geography, politics and heterodox political economy (currency hierarchy,
    international financial subordination, monetary sovereignty), with particular depth on
    Africa and the Global South. We want scholarship on how people, firms and states live
    with, manage, theorise and contest soft currencies: colonial and imperial monetary
    systems, exchange controls and parallel markets, dollarization, remittances and savings,
    monetary expertise and instruments, and the meanings and experience of money.
    We do NOT want mainstream exchange-rate forecasting, econometric macro without a
    historical, institutional or ethnographic argument, crypto price commentary, or US
    campaign-finance "soft money".

# ---------------------------------------------------------------------
#  TERMS: the vocabulary whose density the Observatory tracks.
#  Matching is case-insensitive on titles and abstracts; accents ignored.
#  Run the "Suggest terms" workflow to get candidates drawn from the anchor
#  literature (data/terms_suggested.yaml), then copy the good ones here.
#  A line "a | b | c" counts spelling variants as one term (reported as "a").
# ---------------------------------------------------------------------
terms:
  - soft currency | soft currencies
  - hard currency | hard currencies
  - convertibility | inconvertible | inconvertibility | non-convertible
  - currency hierarchy | monetary hierarchy | hierarchy of currencies | hierarquia monetária
  - international financial subordination | financial subordination
  - subordinate financialization | subordinate financialisation
  - monetary sovereignty | currency sovereignty | souveraineté monétaire
  - monetary dependency | monetary dependence
  - dollarization | dollarisation | de-dollarization | de-dollarisation
  - currency substitution
  - parallel exchange rate | parallel market | black market rate | informal exchange
  - exchange control | exchange controls | capital controls
  - currency board | currency boards
  - sterling area
  - franc zone | cfa franc | franc cfa
  - blocked balances | blocked accounts | sterling balances
  - counterpart funds | pl 480 | public law 480
  - colonial currency | colonial money | colonial monetary
  - devaluation
  - hyperinflation
  - foreign exchange shortage | forex shortage | dollar shortage
  - remittances
  - multiple currencies | currency multiplicity | multiple monies | plural monies
  - monetary repertoires | repertoires of money
  - earmarking | earmarked money
  - liquidity premium
  - balance of payments
  - special drawing rights
  - swap lines
  - local currency | complementary currency | community currency
  - mobile money
  - stablecoin | stablecoins
  - central bank digital currency | cbdc
  - imf conditionality
  - cowries | manillas | cowrie

# Titles containing these are dropped before anything else.
negative_keywords:
  - soft money
  - campaign finance
  - soft power
  - soft robot
  - soft tissue
  - soft skills
  - soft computing
  - soft matter
  - soft drink
  - cryptocurrency price prediction
  - bitcoin price
  - forecasting exchange rates using
  - deep learning
  - neural network

# ---------------------------------------------------------------------
