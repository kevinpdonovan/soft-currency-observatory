# =====================================================================
#  CITATION ANCHORS: the works whose citing literature the Observatory tracks.
#
#  This is NOT the Core Readings list (config/readings.yaml). An anchor earns
#  its place by being *diagnostic*: citing it says something about a work.
#  Very widely cited classics (Zelizer, Graeber, Simmel) are poor anchors
#  because thousands of unrelated works cite them. They belong in Core
#  Readings, or here with a low weight.
#
#  Fields
#    key      short id used everywhere (never change once set)
#    cite     how it appears on the site
#    title / authors / year  used to find the work in OpenAlex on the first run
#    doi      optional; the most reliable way to match
#    weight   optional manual override (0–1). If omitted, it is computed from
#             the work's total citation count: widely cited = lower weight.
#    verify   true = I (Claude) was unsure of a bibliographic detail; check the
#             match in config/anchors_lock.yaml after the first run.
#
#  After the first run, config/anchors_lock.yaml shows what each anchor
#  matched in OpenAlex. Fix wrong matches there by hand.
#  New anchors are added here when you tick a "candidate anchor" in a review.
# =====================================================================

