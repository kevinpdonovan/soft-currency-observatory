premise: >
  In the long run, all currencies are soft.

home_intro: >
  The Soft Currency Observatory is a research network and working archive on currencies
  that are inconvertible, subordinate, unstable or confined to particular circuits, and
  on the people, firms and states who live with them. Its core is economic anthropology,
  in conversation with history, sociology, geography, politics and political economy.

research:
  intro: |
    DRAFT. A paragraph on the project's argument: that softness is the ordinary condition of
    money rather than a pathology of the periphery, and what follows from studying it
    ethnographically and historically.
  # Working areas. They organise the project's thinking; the archive does not sort by them.
  areas:
    - name: "Soft Currency Histories"
      text: "DRAFT. Colonial and imperial monetary systems, currency boards, sterling and franc zones, decolonisation."
    - name: "Instruments & Expertise"
      text: "DRAFT. Exchange controls, central banking, conditionality, and the devices that manage softness."
    - name: "Livelihoods & Property"
      text: "DRAFT. Savings, remittances, land and other stores of value where money is not trusted to hold."
    - name: "Soft Currency Worlds"
      text: "DRAFT. How people make sense of and live with money that does not hold its value."
    - name: "Politics"
      text: "DRAFT. Currency hierarchy, monetary sovereignty and international financial subordination."

