# Closing a "monthly-review" issue (as completed) publishes the ticked works.
name: Publish accessions
on:
  issues:
    types: [closed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'monthly-review') && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Publish ticked works
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > review-body.md
          python -m observatory publish review-body.md
      - name: Save
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add data config
          git commit -m "Publish ${{ github.event.issue.title }}" || echo "nothing to commit"
          git pull --rebase && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
