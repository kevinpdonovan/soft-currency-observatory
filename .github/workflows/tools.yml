# Occasional tools, run by hand from the Actions tab.
#   terms   : suggest vocabulary from the anchor literature -> data/terms_suggested.yaml
#   lineage : citation lineage of one anchor (e.g. guyer-2004) or OpenAlex id -> a page under Density
#   resolve : re-match anchors after editing config/anchors.yaml
name: Tools
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Which tool"
        type: choice
        options: [terms, lineage, resolve]
        default: lineage
      target:
        description: "For lineage: an anchor key (e.g. guyer-2004) or OpenAlex work id (W…)"
        required: false
        default: "guyer-2004"
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          if [ "${{ inputs.tool }}" = "lineage" ]; then python -m observatory lineage "${{ inputs.target }}";
          else python -m observatory ${{ inputs.tool }}; fi
      - name: Save
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add -A data config
          git commit -m "Tool: ${{ inputs.tool }} ${{ inputs.target }}" || echo "nothing to commit"
          git pull --rebase && git push
